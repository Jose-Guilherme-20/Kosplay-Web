<section
  class="container d-flex flex-column align-items-center justify-content-center"
>
  <div class="container-page">
    <div
      class="container-form d-flex flex-column align-items-center justify-content-center"
    >
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div>
          <label for="email">Email</label>
          <input
            id="email"
            placeholder="E-mail"
            formControlName="email"
            type="email"
          />
        </div>
        <div>
          <label for="password">Senha</label>
          <input
            id="password"
            placeholder="Senha"
            formControlName="password"
            type="password"
          />
        </div>
        <span class="recover-password d-flex justify-content-end"
          ><a href="#">Recuperar Senha</a></span
        >
        <button (click)="RedirectToRegister()">Cadastrar</button>
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>
</section>
